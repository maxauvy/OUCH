# Weekly update PRs for npm packages and for the GitHub Actions pinned by SHA
# in the deploy workflow.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request for all the actions: they are used together in the
    # deploy and CI workflows, and separate ones conflict with each other.
    groups:
      github-actions:
        patterns:
          - "*"
