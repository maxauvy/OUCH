<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>OUCH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;600;700&display=block">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Public Sans",sans-serif;color:#fff}
#hero{position:relative;width:1600px;height:800px;overflow:hidden;background:#574a7a}
.bar{position:absolute;left:0;top:0;right:0;height:14px;background:linear-gradient(90deg,#e3a73b,#a894c9 55%,#574a7a)}
.sun{position:absolute;width:1100px;height:1100px;border-radius:50%;background:rgba(255,255,255,.07);right:-300px;top:-420px}
.logo{position:absolute;left:80px;top:70px;width:92px;height:92px}
h1{position:absolute;left:80px;top:200px;width:820px;margin:0;font-weight:400}
.s{display:block;font-family:"Instrument Serif",serif;font-style:italic;font-size:112px;line-height:.92;color:#f7d78e;letter-spacing:-.02em}
.d{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:96px;line-height:.95;letter-spacing:-.03em;margin-top:10px}
.lead{position:absolute;left:80px;top:500px;width:700px;font-size:30px;line-height:1.38;color:#ece7f8;margin:0}
.chips{position:absolute;left:80px;bottom:60px;display:flex;gap:14px}
.chips span{background:rgba(255,255,255,.14);border-radius:999px;padding:10px 24px;font-size:25px;font-weight:600}
.phone{position:absolute;background:#fff;border-radius:64px;padding:15px;box-shadow:0 0 0 3px rgba(255,255,255,.55);overflow:hidden}
.phone .scr{border-radius:50px;overflow:hidden;height:100%;background:#f3f6f8}.phone img{display:block;width:100%}
.p1{left:930px;top:130px;width:330px;height:760px;transform:rotate(-4deg)}
.p2{left:1230px;top:40px;width:300px;height:640px;transform:rotate(3deg)}
.card{position:absolute;left:1010px;top:560px;width:520px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.55);transform:rotate(-2deg)}.card img{display:block;width:100%}
</style></head><body><div id="hero"><div class="bar"></div><div class="sun"></div><img class="logo" src="assets/logo.svg" alt="">
<h1><span class="s">Ce qui l’aggrave,</span><span class="d">ce qui l’apaise.</span></h1><p class="lead">Un carnet de douleur pour la fibromyalgie et les autres douleurs chroniques. Une minute par jour, des pistes tirées de tes notes, et un rapport pour ton médecin.</p><div class="chips"><span>Gratuit</span><span>Libre</span><span>Sans compte</span><span>Sur ton téléphone</span></div>
<div class="phone p1"><div class="scr"><img src="assets/today.png" alt=""></div></div>
<div class="phone p2"><div class="scr"><img src="assets/piste.png" alt=""></div></div>
<div class="card"><img src="assets/rapport.png" alt=""></div></div></body></html>
